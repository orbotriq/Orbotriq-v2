# Phase 16E1: cloud Firebase access deliberately disabled.
# Do not deploy this configuration. Replace only after isolated staging review.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: ORBOTRIQ_FIREBASE_MODE
    value: disabled
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MODE
    value: disabled
    availability:
      - BUILD
      - RUNTIME
