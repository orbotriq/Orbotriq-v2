# Firebase App Hosting backend configuration.
# Create/link the App Hosting backend in Firebase Console before deployment.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vaanio-app
    availability:
      - BUILD
      - RUNTIME